<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Indigo to Violet to Cyan) -->
    <linearGradient id="bgGrad" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="32%" stop-color="#6366F1"/>
      <stop offset="68%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Top Sheen / Frosted Glass Highlight -->
    <linearGradient id="glassGrad" x1="24" y1="24" x2="24" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glow Behind Star -->
    <radialGradient id="centerGlow" cx="256" cy="252" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Dynamic Checkmark Gradient -->
    <linearGradient id="chkGrad" x1="174" y1="270" x2="352" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="tileShadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Tile -->
  <g filter="url(#tileShadow)">
    <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#bgGrad)"/>
    <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#glassGrad)"/>
    <rect x="24" y="24" width="464" height="464" rx="106" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- 2. Soft Ambient Center Glow -->
  <circle cx="256" cy="252" r="170" fill="url(#centerGlow)"/>

  <!-- 3. Central 4-Point Sparkle Star with Diamond-Cut Facets -->
  <!-- Top-Right Facet (Pure White) -->
  <path d="M 256 252 L 256 100 C 256 210, 298 252, 408 252 L 256 252 Z" fill="#FFFFFF"/>
  <!-- Top-Left Facet (Lavender White) -->
  <path d="M 256 252 L 256 100 C 256 210, 214 252, 104 252 L 256 252 Z" fill="#F1F5F9"/>
  <!-- Bottom-Left Facet (Ice Lavender) -->
  <path d="M 256 252 L 256 404 C 256 294, 214 252, 104 252 L 256 252 Z" fill="#E0E7FF"/>
  <!-- Bottom-Right Facet (Ice Cyan White) -->
  <path d="M 256 252 L 256 404 C 256 294, 298 252, 408 252 L 256 252 Z" fill="#ECFEFF"/>

  <!-- Star Crisp Outline -->
  <path d="M 256 100 C 256 210, 298 252, 408 252 C 298 252, 256 294, 256 404 C 256 294, 214 252, 104 252 C 214 252, 256 210, 256 100 Z" 
        stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.8" fill="none"/>

  <!-- 4. Dynamic Achievement Checkmark / Ribbon ("達成") -->
  <!-- Dark/Contrast Outer Rim -->
  <path d="M 174 270 L 232 328 L 352 200" stroke="#4338CA" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Vibrant Gradient Body -->
  <path d="M 174 270 L 232 328 L 352 200" stroke="url(#chkGrad)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pure White Core Line -->
  <path d="M 174 270 L 232 328 L 352 200" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. Top-Right Companion Sparkle (Celebratory Gold) -->
  <path d="M 382 102 C 382 133, 393 144, 424 144 C 393 144, 382 155, 382 186 C 382 155, 371 144, 340 144 C 371 144, 382 133, 382 102 Z" 
        fill="#FEF08A" stroke="#FDE047" stroke-width="1.2"/>

  <!-- 6. Bottom-Left Companion Sparkle (Cyan Radiant Spark) -->
  <path d="M 136 332 C 136 356, 144 364, 168 364 C 144 364, 136 372, 136 396 C 136 372, 128 364, 104 364 C 128 364, 136 356, 136 332 Z" 
        fill="#67E8F9" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- 7. Confetti / Micro-Sparkle Elements -->
  <circle cx="402" cy="220" r="5.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="124" cy="184" r="4.5" fill="#FDE047" fill-opacity="0.9"/>
  <circle cx="324" cy="380" r="5.0" fill="#A7F3D0" fill-opacity="0.9"/>
  <circle cx="200" cy="128" r="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>

